<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>KANEPE — Kumanda</title>
  <meta name="theme-color" content="#0e0c22" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/play.css" />
</head>
<body>
  <section id="join" class="screen">
    <div class="bg-blobs"><i></i><i></i><i></i></div>
    <form id="joinForm" autocomplete="off">
      <div class="logo"><span class="mark"><i></i><i></i><i></i><i></i></span>KANEPE</div>
      <p class="sub">TV ekranındaki kodu gir</p>
      <label class="field">
        <span>Oda kodu</span>
        <input id="code" class="code" maxlength="4" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="ABCD" required />
      </label>
      <label class="field">
        <span>Adın</span>
        <input id="name" maxlength="12" placeholder="Takma adın" autocapitalize="words" spellcheck="false" required />
      </label>
      <button class="big" type="submit" id="joinBtn">KATIL</button>
      <p id="joinErr" class="err" role="alert"></p>
      <a class="tvlink" href="/tv">Bu cihaz TV ekranı olsun →</a>
    </form>
  </section>

  <section id="main" class="screen hidden">
    <header class="bar">
      <span class="me"><i class="dot"></i><b id="meName">—</b><small id="meSlot"></small></span>
      <span class="spacer"></span>
      <span id="net" class="net" title="Bağlantı"></span>
      <button id="fsBtn" class="ibtn" aria-label="Tam ekran">⛶</button>
      <button id="pauseBtn" class="ibtn hidden" aria-label="Duraklat">❚❚</button>
    </header>
    <div id="view"></div>
    <div id="overlay" class="overlay hidden"><div class="spinner"></div><p id="overlayText"></p></div>
  </section>

  <script type="module" src="/js/play.js"></script>
</body>
</html>
